<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <title>模型到 NPU 仿真的六层链路</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="820" fill="#FFFFFF"/>

  <rect x="100" y="40" width="480" height="450" rx="16" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
  <text x="120" y="62" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">构建期：离线一次性，产出镜像</text>

  <g>
    <rect x="180" y="80" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="340" y="98" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">1 模型层</text>
    <text x="340" y="116" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">浮点模型 → 量化模型</text>
  </g>
  <line x1="340" y1="136" x2="340" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="150" width="160" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="340" y="164" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">量化模型文件</text>
  <line x1="340" y1="178" x2="340" y2="190" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="180" y="192" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="340" y="210" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">2 前端 / 图导入层</text>
    <text x="340" y="228" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">解析格式，统一算子定义</text>
  </g>
  <line x1="340" y1="248" x2="340" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="262" width="160" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="340" y="276" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">算子图（中间表示）</text>
  <line x1="340" y1="290" x2="340" y2="302" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="180" y="304" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="340" y="322" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">3 编译 / 内核映射层</text>
    <text x="340" y="340" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">算子 → 硬件指令与内存布局</text>
  </g>
  <line x1="340" y1="360" x2="340" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="374" width="160" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="340" y="388" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">目标处理器可执行程序</text>
  <line x1="340" y1="402" x2="340" y2="414" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="180" y="416" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="340" y="434" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">4 运行时 / 系统支撑层</text>
    <text x="340" y="452" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">启动代码、内存分配、主机通道</text>
  </g>
  <line x1="340" y1="472" x2="340" y2="508" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="510" width="160" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="340" y="524" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">可启动镜像</text>
  <line x1="340" y1="538" x2="340" y2="596" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="100" y="558" width="480" height="202" rx="16" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
  <text x="120" y="580" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">运行期：反复执行</text>

  <g>
    <rect x="180" y="598" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="340" y="616" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">6 主机驱动层</text>
    <text x="340" y="634" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">送入镜像与数据，取回结果</text>
  </g>
  <line x1="300" y1="654" x2="300" y2="682" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="684" x2="380" y2="656" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="180" y="684" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="340" y="702" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">5 仿真器层</text>
    <text x="340" y="720" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">执行镜像，产出结果与计数</text>
  </g>

  <rect x="150" y="783" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="172" y="790" font-size="12" fill="#5F5E5A" dominant-baseline="central">构建期模块</text>
  <rect x="300" y="783" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="322" y="790" font-size="12" fill="#5F5E5A" dominant-baseline="central">运行期模块</text>
  <rect x="450" y="783" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="472" y="790" font-size="12" fill="#5F5E5A" dominant-baseline="central">层间接口产物</text>
</svg>
